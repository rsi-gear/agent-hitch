name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  packaged-harness:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm pack --dry-run
      - run: npm run canary:packaged-harness

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: npm run coverage
      - run: npm pack --dry-run
      - name: Release validation smoke test
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: |
          PREFIX="$(mktemp -d)"
          npm pack --pack-destination "$PREFIX"
          npm install --prefix "$PREFIX" "$PREFIX"/agent-hitch-*.tgz --no-save
          "$PREFIX"/node_modules/.bin/hitch --version
          "$PREFIX"/node_modules/.bin/hitch list --json
          # eval doctor is a diagnostic command: without a managed Harbor
          # install or a running Docker daemon it reports "action_required"
          # and exits 3, which is a valid result for this smoke test. Require
          # valid JSON output and accept either the ready or not-ready code.
          set +e
          "$PREFIX"/node_modules/.bin/hitch eval doctor --json > "$PREFIX/doctor.json"
          doctor_code=$?
          set -e
          python3 -c "import json,sys; json.load(open('$PREFIX/doctor.json')); sys.exit(0)"
          [ "$doctor_code" -eq 0 ] || [ "$doctor_code" -eq 3 ] || { echo "eval doctor exited $doctor_code" >&2; exit 1; }
          python3 -c "import pathlib; compile(pathlib.Path('$PREFIX/node_modules/agent-hitch/integrations/harbor/hitch_harbor_agent.py').read_text(), 'x', 'exec'); print('bridge syntax OK')"

  test-windows:
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        shard: [1, 2, 3, 4]
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: node --test --test-shard=${{ matrix.shard }}/4 "dist/test/*.test.js"
      - run: npm pack --dry-run
