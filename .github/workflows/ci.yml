name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare Python bridge test dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/hitch-test-python"
          "$RUNNER_TEMP/hitch-test-python/bin/python" -m pip install -r test-support/requirements.txt
          echo "$RUNNER_TEMP/hitch-test-python/bin" >> "$GITHUB_PATH"
      - run: npm ci
      # The build invokes tsc with the same configuration as typecheck.
      - name: Build and typecheck
        run: npm run build
      - name: Check architecture and compiled syntax
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: |
          npm run check:architecture
          node dist/scripts/check-syntax.js
          npm run docs:check
      - name: Test
        if: matrix.os != 'ubuntu-latest' || matrix.node != 24
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            # The binding venv shares the host stdlib. Other Python tests can
            # create bytecode caches while its runtime inventory is being read.
            node --test --test-timeout=120000 dist/test/evaluation-binding.test.js
            tests=()
            for file in dist/test/*.test.js; do
              if [ "$file" != "dist/test/evaluation-binding.test.js" ]; then
                tests+=("$file")
              fi
            done
            node --test --test-timeout=120000 "${tests[@]}"
          else
            npm test
          fi
      - name: Test with coverage
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: npm run coverage
      - name: Benchmark research lifecycle
        run: node --test benchmark-packages/kaggle/tests/research/*.test.mjs
      - name: Standalone analysis package
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: node scripts/check-analysis-package.mjs
      - name: Packaged harness canary
        if: matrix.os == 'ubuntu-latest'
        run: node dist/scripts/canary-packaged-harness.js
      - name: External endpoint canary without Python or CUDA
        if: matrix.os == 'ubuntu-latest'
        run: node dist/scripts/canary-external-endpoint.js
      - if: matrix.os != 'ubuntu-latest' || matrix.node != 24
        run: npm pack --dry-run
      - name: Release validation smoke test
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: |
          PREFIX="$(mktemp -d)"
          npm pack --pack-destination "$PREFIX"
          npm install --prefix "$PREFIX" "$PREFIX"/agent-hitch-*.tgz --no-save
          "$PREFIX"/node_modules/.bin/hitch --version
          "$PREFIX"/node_modules/.bin/hitch list --json
          node "$PREFIX/node_modules/agent-hitch/dist/scripts/canary-external-endpoint.js"
          # eval doctor is a diagnostic command: without a managed Harbor
          # install or a running Docker daemon it reports "action_required"
          # and exits 3, which is a valid result for this smoke test. Require
          # valid JSON output and accept either the ready or not-ready code.
          set +e
          "$PREFIX"/node_modules/.bin/hitch eval doctor --json > "$PREFIX/doctor.json"
          doctor_code=$?
          set -e
          python3 -c "import json,sys; json.load(open('$PREFIX/doctor.json')); sys.exit(0)"
          [ "$doctor_code" -eq 0 ] || [ "$doctor_code" -eq 3 ] || { echo "eval doctor exited $doctor_code" >&2; exit 1; }
          python3 -c "import pathlib; compile(pathlib.Path('$PREFIX/node_modules/agent-hitch/integrations/harbor/hitch_harbor_agent.py').read_text(), 'x', 'exec'); print('bridge syntax OK')"
          # A local install may hoist unbundled dependencies outside Hitch.
          # Verify the installed execution closure, not the source checkout.
          node --input-type=module - "$PREFIX" <<'NODE'
          import path from 'node:path';
          import { pathToFileURL } from 'node:url';
          const prefix = process.argv[2];
          const modulePath = path.join(prefix, 'node_modules/agent-hitch/dist/src/controller-runtime/index.js');
          const { ensureControllerRuntime, useControllerRuntimeDirectory } = await import(pathToFileURL(modulePath));
          const runtime = await ensureControllerRuntime({ root: path.join(prefix, 'runtime-state') });
          await useControllerRuntimeDirectory(runtime.directory, runtime.runtime_id);
          console.log(`installed runtime verified: ${runtime.runtime_id}`);
          NODE

  test-windows:
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Build and typecheck
        run: npm run build
      - run: node --test dist/test/executable.test.js dist/test/windows-support.test.js
      - name: Test host credential helper process cleanup
        run: python test-support/harbor_host_credentials_smoke.py integrations/harbor/hitch_host_credentials.py
        env:
          PYTHONDONTWRITEBYTECODE: "1"
      - name: Packaged harness canary
        run: node dist/scripts/canary-packaged-harness.js
      - run: npm pack --dry-run
