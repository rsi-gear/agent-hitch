name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # The build invokes tsc with the same configuration as typecheck.
      - name: Build and typecheck
        run: npm run build
      - name: Check architecture and compiled syntax
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: |
          npm run check:architecture
          node dist/scripts/check-syntax.js
      - name: Test
        if: matrix.os != 'ubuntu-latest' || matrix.node != 24
        run: npm test
      - name: Test with coverage
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: npm run coverage
      - name: Packaged harness canary
        if: matrix.os == 'ubuntu-latest'
        run: node dist/scripts/canary-packaged-harness.js
      - if: matrix.os != 'ubuntu-latest' || matrix.node != 24
        run: npm pack --dry-run
      - name: Release validation smoke test
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: |
          PREFIX="$(mktemp -d)"
          npm pack --pack-destination "$PREFIX"
          npm install --prefix "$PREFIX" "$PREFIX"/agent-hitch-*.tgz --no-save
          "$PREFIX"/node_modules/.bin/hitch --version
          "$PREFIX"/node_modules/.bin/hitch list --json
          # eval doctor is a diagnostic command: without a managed Harbor
          # install or a running Docker daemon it reports "action_required"
          # and exits 3, which is a valid result for this smoke test. Require
          # valid JSON output and accept either the ready or not-ready code.
          set +e
          "$PREFIX"/node_modules/.bin/hitch eval doctor --json > "$PREFIX/doctor.json"
          doctor_code=$?
          set -e
          python3 -c "import json,sys; json.load(open('$PREFIX/doctor.json')); sys.exit(0)"
          [ "$doctor_code" -eq 0 ] || [ "$doctor_code" -eq 3 ] || { echo "eval doctor exited $doctor_code" >&2; exit 1; }
          python3 -c "import pathlib; compile(pathlib.Path('$PREFIX/node_modules/agent-hitch/integrations/harbor/hitch_harbor_agent.py').read_text(), 'x', 'exec'); print('bridge syntax OK')"

  test-windows:
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Build and typecheck
        run: npm run build
      - run: node --test dist/test/executable.test.js dist/test/windows-support.test.js
      - name: Packaged harness canary
        run: node dist/scripts/canary-packaged-harness.js
      - run: npm pack --dry-run
