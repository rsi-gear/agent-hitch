name: Publish npm package

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # dist/ is not committed (spec §8.3), so compile before running any
      # validation that executes a compiled script.
      - run: npm ci
      - run: npm run build

      - name: Validate release metadata
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: node dist/scripts/check-release.js "$RELEASE_TAG" "$RELEASE_IS_PRERELEASE"

      - name: Require a commit from main
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          git fetch origin main --no-tags
          release_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
          git merge-base --is-ancestor "$release_commit" origin/main || {
            echo "Release tag $RELEASE_TAG does not point to a commit on main" >&2
            exit 1
          }

      - run: npm run check

      - name: Publish stable release
        if: ${{ !github.event.release.prerelease }}
        run: npm publish --access public --tag latest

      - name: Publish prerelease
        if: ${{ github.event.release.prerelease }}
        run: npm publish --access public --tag next
