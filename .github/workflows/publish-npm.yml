name: Publish npm package

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    # Match CI's tested seccomp host; newer Ubuntu AppArmor profiles block
    # the pinned isolation runtime's nested user namespace.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # check builds dist/ and runs the full repository checks once.
      - run: npm ci
      - name: Prepare Linux isolated-run dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y bubblewrap socat ripgrep
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - run: npm run check

      - name: Validate release metadata
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: node dist/scripts/check-release.js "$RELEASE_TAG" "$RELEASE_IS_PRERELEASE"

      - name: Require a commit from main
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          git fetch origin main --no-tags
          release_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
          git merge-base --is-ancestor "$release_commit" origin/main || {
            echo "Release tag $RELEASE_TAG does not point to a commit on main" >&2
            exit 1
          }

      # The complete check already passed above. Skip prepublishOnly here to
      # avoid rebuilding and testing again; keep the hook for other callers.
      - name: Publish stable release
        if: ${{ !github.event.release.prerelease }}
        run: npm publish --access public --tag latest --ignore-scripts

      - name: Publish prerelease
        if: ${{ github.event.release.prerelease }}
        run: npm publish --access public --tag next --ignore-scripts
